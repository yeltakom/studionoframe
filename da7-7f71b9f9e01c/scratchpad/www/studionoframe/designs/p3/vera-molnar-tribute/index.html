<!DOCTYPE html><html lang="en" data-variant="p3"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" type="image/svg+xml" href="/studionoframe/favicon.svg"><title>In Search of Vera Molnár — Galerie</title><link rel="stylesheet" href="/studionoframe/_astro/inner.B8EYMA4_.css"></head><body><a class="back-to-picker" href="/studionoframe/designs/">← Dört yön</a><nav class="switcher" aria-label="İç sayfa alternatifleri"><a href="/studionoframe/designs/p1/vera-molnar-tribute">P1 Sequenz</a><a href="/studionoframe/designs/p2/vera-molnar-tribute">P2 Dossier</a><a href="/studionoframe/designs/p3/vera-molnar-tribute" aria-current="page">P3 Galerie</a><a href="/studionoframe/projects/vera-molnar-tribute">Yayında</a><a href="/studionoframe/designs/">← Yönler</a></nav><div class="p3"><p class="caption"><span id="frameNo">01</span> / 04 — Exhibition design and installation for In Search of Vera Molnár at Pera Museum, a tribute </p><div class="stage"><img src="/studionoframe/images/projects/vera-molnar-tribute/vera-molnar-tribute-01.jpg" alt="In Search of Vera Molnár — Pera Museum, Istanbul, 1" class="is-active" loading="eager" decoding="async"><img src="/studionoframe/images/projects/vera-molnar-tribute/vera-molnar-tribute-02.jpg" alt="In Search of Vera Molnár — Pera Museum, Istanbul, 2" loading="lazy" decoding="async"><img src="/studionoframe/images/projects/vera-molnar-tribute/vera-molnar-tribute-03.jpg" alt="In Search of Vera Molnár — Pera Museum, Istanbul, 3" loading="lazy" decoding="async"><img src="/studionoframe/images/projects/vera-molnar-tribute/vera-molnar-tribute-04.jpg" alt="In Search of Vera Molnár — Pera Museum, Istanbul, 4" loading="lazy" decoding="async"></div><div class="bar"><div class="top"><h1>In Search of Vera Molnár</h1><span class="meta">Pera Museum, Istanbul · 2024 — Exhibition Design &amp; Installation Management</span><a class="meta" href="/studionoframe/designs/p3/fusun-onur-ludwig">Next: Füsun Onur: Retrospective →</a></div><div class="thumbs"><button type="button" data-index="0" aria-current="true" aria-label="Frame 1"><img src="/studionoframe/images/projects/vera-molnar-tribute/vera-molnar-tribute-01.jpg" alt="" loading="lazy" decoding="async"></button><button type="button" data-index="1" aria-current="false" aria-label="Frame 2"><img src="/studionoframe/images/projects/vera-molnar-tribute/vera-molnar-tribute-02.jpg" alt="" loading="lazy" decoding="async"></button><button type="button" data-index="2" aria-current="false" aria-label="Frame 3"><img src="/studionoframe/images/projects/vera-molnar-tribute/vera-molnar-tribute-03.jpg" alt="" loading="lazy" decoding="async"></button><button type="button" data-index="3" aria-current="false" aria-label="Frame 4"><img src="/studionoframe/images/projects/vera-molnar-tribute/vera-molnar-tribute-04.jpg" alt="" loading="lazy" decoding="async"></button></div></div></div><script>
    const shots = [...document.querySelectorAll('.stage img')];
    const buttons = [...document.querySelectorAll('.thumbs button')];
    const frameNo = document.getElementById('frameNo');
    let index = 0;

    const show = (next) => {
      index = (next + shots.length) % shots.length;
      shots.forEach((s, i) => s.classList.toggle('is-active', i === index));
      buttons.forEach((b, i) => b.setAttribute('aria-current', String(i === index)));
      frameNo.textContent = String(index + 1).padStart(2, '0');
      buttons[index].scrollIntoView({ block: 'nearest', inline: 'center' });
    };

    buttons.forEach((b) => b.addEventListener('click', () => show(Number(b.dataset.index))));
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { e.preventDefault(); show(index + 1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); show(index - 1); }
    });
    document.querySelector('.stage').addEventListener('click', () => show(index + 1));
  </script></body></html>
