studionoframe/images/projects/istanbul-modern-culture/istanbul-modern-culture-06.jpg" alt="Caution! Slippery Ground — Istanbul Modern, 6" loading="lazy" decoding="async"></div><div class="bar"><div class="top"><h1>Caution! Slippery Ground</h1><span class="meta">Istanbul Modern · 2015 — Curator &amp; Exhibition Designer — KOTUstudio</span><a class="meta" href="/studionoframe/designs/p3/vardiya">Next: Vardiya / The Shift →</a></div><div class="thumbs"><button type="button" data-index="0" aria-current="true" aria-label="Frame 1"><img src="/studionoframe/images/projects/istanbul-modern-culture/istanbul-modern-culture-01.jpg" alt="" loading="lazy" decoding="async"></button><button type="button" data-index="1" aria-current="false" aria-label="Frame 2"><img src="/studionoframe/images/projects/istanbul-modern-culture/istanbul-modern-culture-02.jpg" alt="" loading="lazy" decoding="async"></button><button type="button" data-index="2" aria-current="false" aria-label="Frame 3"><img src="/studionoframe/images/projects/istanbul-modern-culture/istanbul-modern-culture-03.jpg" alt="" loading="lazy" decoding="async"></button><button type="button" data-index="3" aria-current="false" aria-label="Frame 4"><img src="/studionoframe/images/projects/istanbul-modern-culture/istanbul-modern-culture-04.jpg" alt="" loading="lazy" decoding="async"></button><button type="button" data-index="4" aria-current="false" aria-label="Frame 5"><img src="/studionoframe/images/projects/istanbul-modern-culture/istanbul-modern-culture-05.jpg" alt="" loading="lazy" decoding="async"></button><button type="button" data-index="5" aria-current="false" aria-label="Frame 6"><img src="/studionoframe/images/projects/istanbul-modern-culture/istanbul-modern-culture-06.jpg" alt="" loading="lazy" decoding="async"></button></div></div></div><script>
    const shots = [...document.querySelectorAll('.stage img')];
    const buttons = [...document.querySelectorAll('.thumbs button')];
    const frameNo = document.getElementById('frameNo');
    let index = 0;

    const show = (next) => {
      index = (next + shots.length) % shots.length;
      shots.forEach((s, i) => s.classList.toggle('is-active', i === index));
      buttons.forEach((b, i) => b.setAttribute('aria-current', String(i === index)));
      frameNo.textContent = String(index + 1).padStart(2, '0');
      buttons[index].scrollIntoView({ block: 'nearest', inline: 'center' });
    };

    buttons.forEach((b) => b.addEventListener('click', () => show(Number(b.dataset.index))));
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { e.preventDefault(); show(index + 1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); show(index - 1); }
    });
    document.querySelector('.stage').addEventListener('click', () => show(index + 1));
  </script></body></html>
